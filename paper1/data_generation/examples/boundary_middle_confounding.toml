# Boundary panel: deliberately includes an intermediate confounder.
# Its structural truth is generated and recorded, but it must not be scored as an admissible efficiency case.

[graph]
n_baseline = 16
baseline_mean_parents = 1.5
baseline_max_parents = 3
n_shared = 1
n_x_extra = 2
n_m_extra = 2
n_y_extra = 2
n_inst = 1
n_pm = 1
n_py = 1
n_irrelevant = 1
xm_chain_nodes = 0
my_chain_nodes = 0
n_parallel = 1
n_post_descendants = 0
n_middle_confounders = 1
allow_parallel_mediators = true
allow_post_descendants = false
allow_middle_confounding = true
n_auxiliary_baseline_parents = 2
direct_edge = true

[mechanism]
mode = "linear"
edge_functions = ["id"]
protected_function = "id"
nonlinear_fraction = 0.0
negative_edge_fraction = 0.1
weak_fraction = 0.15
weak_multiplier = 0.2
weight_min = 0.25
weight_max = 0.75
noise_distribution = "normal"
noise_df = 5.0
noise_sd = 1.0
intercept_sd = 0.0
xm_weight = 0.6
my_weight = 0.5
direct_weight = 0.2
chain_weight = 0.6
parallel_x_weight = 0.5
parallel_y_weight = 0.4
instrument_weight = 0.7
predictor_weight = 0.5
outcome_interaction = 0.0

[calibration]
enabled = true
n_samples = 4096
target_signal_sd = 0.8
scale_floor = 1e-8

[experiment]
n_samples = 1000
n_graphs = 1
n_replicates = 2
graph_seed = 20261012
mechanism_seed = 20261022
calibration_seed = 20261032
data_seed = 20261042
truth_seed = 20261052
truth_samples = 10000
chunk_size = 1000
x0 = 0.0
x1 = 1.0

[output]
directory = "paper1_out/data_generation_review_v1/boundary"
csv = true
plot = true
preview_rows = 8
max_plot_nodes = 80
max_covariance_nodes = 200
